<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vương Quốc Hữu Tỉ - Toán 7</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a2342;
      --accent: #ffca28;
      --teal: #1b6b5a;
      --teal-light: #e0f2ee;
      --danger: #d94336;
      --danger-light: #fdecea;
      --success: #248a4c;
      --success-light: #e6f7ed;
      --card: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Be Vietnam Pro', sans-serif; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #b8e6ff 0%, #e8f8f0 100%);
      color: var(--primary); min-height: 100vh; font-size: 17px; line-height: 1.5;
    }
    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 14px; display: flex; flex-direction: column; }
    .screen { display: none; flex-direction: column; flex: 1; animation: fadeIn 0.22s ease; }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .logo-q {
      width: 82px; height: 82px; margin: 10px auto 6px; background: #fff;
      border: 4px solid var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 50px; font-weight: 900; box-shadow: 0 5px 0 var(--primary);
    }
    .game-title {
      text-align: center; font-size: 33px; font-weight: 900; color: var(--accent);
      text-shadow: -2px -2px 0 var(--primary), 2px -2px 0 var(--primary), -2px 2px 0 var(--primary), 2px 2px 0 var(--primary), 0 4px 0 var(--primary);
      margin: 4px 0; line-height: 1.2;
    }
    .subtitle { text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
    .card {
      background: var(--card); border: 3px solid var(--primary); border-radius: 18px;
      padding: 15px; box-shadow: 0 4px 0 var(--primary); margin-bottom: 12px;
    }
    .btn {
      width: 100%; padding: 14px 16px; font-size: 17px; font-weight: 800;
      border: 3px solid var(--primary); border-radius: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 0 var(--primary); margin-bottom: 10px;
      color: var(--primary); background: #fff; transition: transform 0.08s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary); }
    .btn-primary { background: var(--accent); }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 9px 12px; font-size: 15px; margin-bottom: 0; }
    .link-teacher { text-align: center; display: block; margin-top: 8px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 6px; }

    /* Story */
    .story-box { text-align: center; padding: 24px 16px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .story-icon { font-size: 62px; margin-bottom: 12px; }
    .story-text { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #cbd5e1; border: 2px solid var(--primary); }
    .dot.active { background: var(--accent); width: 26px; border-radius: 8px; }

    /* Form & Hero */
    label { font-weight: 800; display: block; margin-bottom: 5px; font-size: 16px; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 12px 14px; font-size: 17px; font-weight: 700;
      border: 3px solid var(--primary); border-radius: 12px; margin-bottom: 12px; background: #f8fafc;
    }
    .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
    .class-item { border: 3px solid var(--primary); border-radius: 14px; padding: 10px; background: #fff; cursor: pointer; }
    .class-item.selected { background: #fff3c4; box-shadow: 0 3px 0 var(--primary); }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .avatar-item { font-size: 30px; background: #fff; border: 3px solid var(--primary); border-radius: 13px; padding: 7px 0; text-align: center; cursor: pointer; }
    .avatar-item.selected { background: var(--accent); transform: scale(1.06); }

    /* HUD */
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; border: 3px solid var(--primary); border-radius: 15px;
      padding: 9px 12px; margin-bottom: 12px; box-shadow: 0 3px 0 var(--primary);
    }
    .hud-user { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
    .hud-stats { display: flex; gap: 9px; font-weight: 800; font-size: 15px; }

    /* 6 Stages Map */
    .stage-card {
      background: #fff; border: 3px solid var(--primary); border-radius: 16px;
      padding: 13px; margin-bottom: 11px; box-shadow: 0 4px 0 var(--primary);
    }
    .stage-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .stage-icon { font-size: 34px; }
    .stage-title { font-weight: 900; font-size: 18px; }
    .stage-desc { font-size: 13px; color: #475569; font-weight: 600; }
    .diff-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .diff-btn {
      padding: 9px 6px; border: 2.5px solid var(--primary); border
