<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vương quốc Hữu Tỉ</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'Segoe UI',sans-serif;color:#fff;min-height:100vh;background:linear-gradient(#171a45,#35276a 55%,#d9748a) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 60%,#fff,transparent),radial-gradient(2px 2px at 85% 50%,#fff,transparent);animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.3}}@keyframes pop{from{transform:scale(.88);opacity:0}}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
#app{max-width:560px;margin:auto;padding:14px;position:relative}
h2,h3{font-family:Georgia,serif;margin:6px 0}.c{text-align:center}
.card{background:rgba(255,255,255,.13);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:16px;margin:10px 0;animation:pop .35s}
.big{font-size:64px;animation:fl 2.5s infinite}.tx{font-size:18px;line-height:1.55;margin:10px 0}.sm{opacity:.85;font-size:14px}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;font:700 16px inherit;background:linear-gradient(#ffd86b,#ffb02e);color:#3b2a00;cursor:pointer;box-shadow:0 4px 0 #b97a0a}
.btn:active{transform:translateY(3px);box-shadow:none}.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:0;font-size:16px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.opt.sel{border-color:#ffd86b;background:rgba(255,216,107,.3)}.opt.cor{background:#1fa971;border-color:#1fa971}.opt.bad{background:#d64545;border-color:#d64545;animation:sk .3s}.opt.rm{opacity:.25}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g4 .opt{text-align:center;font-size:28px;padding:8px}
.bar{display:flex;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px}
.hp{margin:6px 0;font-weight:700;color:#ffd86b}.st{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;margin:6px 0}
.zz{display:flex;flex-direction:column}.nd{width:46%;margin:6px 0;padding:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:3px solid #ffd86b;background:linear-gradient(#7c5cff,#4b2fc9);color:#fff;font-size:30px;cursor:pointer;animation:pop .4s}
.nd small{display:block;font-size:11px}.nd.dn{background:linear-gradient(#1fc98a,#0f8f63)}.nd.lk{filter:grayscale(1);opacity:.5;cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:14px;line-height:1.5}.fb.ok{background:rgba(31,169,113,.35)}.fb.no{background:rgba(214,69,69,.35)}
.wr{background:rgba(0,0,0,.2);border-radius:12px;padding:8px;margin:6px 0;font-size:14px;text-align:left}
#mu{position:fixed;top:10px;right:10px;z-index:9;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;background:rgba(0,0,0,.4);color:#fff}
#fx span{position:fixed;top:-30px;font-size:26px;animation:fall 2.2s linear forwards;z-index:8}
</style></head><body><button id="mu" onclick="mt()">🔊</button><div id="app"></div><div id="fx"></div>
<script src="questions.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbzNG_mk2AgcAYPIX3S3J71vR5Vb5n3Spg0x2sfxBoWKdLM3QTJyuO7igiwD6YRZtIliMA/exec"; // ← DÁN LINK APPS SCRIPT (Web app) VÀO ĐÂY
const $=id=>document.getElementById(id),app=$('app'),R=h=>{app.innerHTML=h;scrollTo(0,0)};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const AV=['🦊','🐯','🐼','🐸','🦁','🐨','🐧','🦄','🐲','🐱','🐶','🐵'];
const ROLES={'Chiến binh':['⚔️','7 Tim thay vì 5'],'Pháp sư':['🧙','2 gợi ý mỗi chặng'],'Thám hiểm':['🧭','Loại 1 đáp án nhiễu'],'Thợ rèn':['🔨','Khiên đỡ lần sai đầu']},RK=Object.keys(ROLES);
const RN=['Làng Tập Hợp Q','Thành Bốn Phép Tính','Rừng Lũy Thừa','Núi Thứ Tự Và Chuyển Vế','Lâu Đài Phong Ấn'],RI=['🏘️','🏰','🌲','⛰️','👑'];
const SN=['Khởi động','Vượt chướng ngại vật','Tăng tốc','Về đích (Boss)'],SI=['🏁','🧗','⚡','👹'];
const BOSS=['Sói Lạc Số','Phù thủy Mẫu Số','Ma Rừng Lũy Thừa','Quỷ Sai Dấu','Đại Ma Vương'],TAG=['Khái niệm & trục số','Bốn phép tính','Lũy thừa','Thứ tự & chuyển vế','Tổng hợp'];
const LV={d:'DỄ',t:'THƯỜNG',k:'KHÓ'},XPL={d:1,t:2,k:3};
const SL=[['📚','Ôn tập Chương I – Số hữu tỉ (Toán 7)','GV biên soạn: Trần Thị Thu Chẳng – Trường THCS Nam Đàn'],['🌈','Vương quốc Hữu Tỉ từng yên bình, nơi mọi phân số sống hoà thuận trên trục số, giữ cho dòng chảy tri thức luôn cân bằng.'],['🌑','Một đêm, Quỷ Sai Dấu và Phù thủy Mẫu Số kéo đến. Chúng làm dấu trừ biến mất, bắt các phân số cộng mà không quy đồng, đảo lộn thứ tự phép tính rồi phong ấn cả năm vùng đất.'],['⚔️','Chỉ một Hiệp sĩ Toán học bản lĩnh mới phá được phong ấn. Người đó chính là em!']];
let S=JSON.parse(localStorage.getItem('hs')||'null'),G={},T={};const save=()=>localStorage.setItem('hs',JSON.stringify(S));
const stars=()=>Object.values(S.prog).reduce((a,b)=>a+b,0);
/* ===== ÂM THANH (tự tổng hợp, không cần file mp3) ===== */
let AC,mute=0,bgT;const NT=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
function tone(f,t,ty,v,d){if(mute||!AC)return;d=d||0;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}
const sfx={ok:()=>[1,3,5].forEach((n,i)=>tone(NT[n],.2,'triangle',.1,i*.09)),no:()=>{tone(180,.3,'sawtooth',.05);tone(140,.3,'sawtooth',.05,.12)},star:()=>[4,5,6,7].forEach((n,i)=>tone(NT[n],.28,'triangle',.1,i*.12)),win:()=>[0,2,4,7,4,7].forEach((n,i)=>tone(NT[n],.35,'triangle',.1,i*.15))};
function bg(){clearInterval(bgT);let i=0;const q=[0,2,4,2,5,4,2,1];bgT=setInterval(()=>{tone(NT[q[i%8]]/2,1.4,'sine',.04);if(i%2==0)tone(NT[q[(i+3)%8]],.9,'sine',.022);i++},900)}
function mt(){mute=!mute;$('mu').textContent=mute?'🔇':'🔊'}
function boom(){for(let i=0;i<30;i++){const s=document.createElement('span');s.textContent=['⭐','✨','🎉','💛'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';$('fx').appendChild(s);setTimeout(()=>s.remove(),3200)}}
/* ===== CỐT TRUYỆN & TẠO NHÂN VẬT ===== */
function intro(){R(`<div class="card c"><div class=big>🛡️</div><h2>Vương quốc Hữu Tỉ</h2><p class=sm>Hành trình của Hiệp sĩ Toán học • Toán 7</p><button class=btn onclick="ac0()">▶ Bắt đầu</button></div>`)}
function ac0(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();bg();sl(0)}
function sl(i){const[e,t,u]=SL[i];R(`<div class="card c"><div class=big>${e}</div><p class=tx>${t}</p>${u?`<p class=sm>${u}</p>`:''}<button class=btn onclick="${i<3?`sl(${i+1})`:S?'map()':'cr()'}">${i<3?'Tiếp ▶':S?'Chơi tiếp':'Tạo nhân vật'}</button></div>`)}
function cr(){T={};R(`<div class=card><h2>Tạo Hiệp sĩ</h2><input id=nm placeholder="Tên nhân vật (VD: Minh Anh)"><input id=cl placeholder="Lớp (VD: 7A4)"><h3>Chọn lớp nhân vật</h3><div class=g2>${RK.map((k,i)=>`<button class=opt id=ro${i} onclick="pr(${i})">${ROLES[k][0]} <b>${k}</b><br><small>${ROLES[k][1]}</small></button>`).join('')}</div><h3>Chọn hình đại diện</h3><div class=g4>${AV.map((a,i)=>`<button class=opt id=av${i} onclick="pa(${i})">${a}</button>`).join('')}</div><button class=btn onclick="go()">Lên đường!</button></div>`)}
function pr(i){T.role=RK[i];RK.forEach((_,j)=>$('ro'+j).classList.toggle('sel',j==i))}
function pa(i){T.av=AV[i];AV.forEach((_,j)=>$('av'+j).classList.toggle('sel',j==i))}
function go(){const n=$('nm').value.replace(/[<>&]/g,'').trim(),c=$('cl').value.replace(/[<>&\s]/g,'').toUpperCase();if(!n||!c||!T.role||!T.av)return alert('Em hãy nhập tên, lớp, chọn lớp nhân vật và hình đại diện nhé!');const m=T.role=='Chiến binh'?7:5;S={name:n,cls:c,role:T.role,av:T.av,max:m,hearts:m,xp:0,gold:0,prog:{},vault:[]};save();sfx.star();map()}
/* ===== BẢN ĐỒ ===== */
const hudIn=()=>`<span>${S.av} ${S.name} (${S.cls})</span><span>❤️${S.hearts}/${S.max}</span><span>⭐${stars()}</span><span>✨${S.xp}</span><span>🪙${S.gold}</span>`,hud=()=>`<div class=bar id=hd>${hudIn()}</div>`;
const opn=(r,s)=>r==1&&s==1||(s>1?S.prog[r+'-'+(s-1)]:S.prog[(r-1)+'-4'])>0;
function map(){let h=hud()+`<h2 class=c>🗺️ Bản đồ Vương quốc Hữu Tỉ</h2>`;for(let r=5;r>=1;r--){h+=`<div class=card><h3>${RI[r-1]} Vòng ${r}: ${RN[r-1]}</h3><div class=zz>`;for(let s=4;s>=1;s--){const st=S.prog[r+'-'+s]||0,o=opn(r,s);h+=`<button class="nd ${o?'':'lk'} ${st?'dn':''}" style="margin-left:${s%2?'6%':'48%'}" ${o?`onclick="lv(${r},${s})"`:'disabled'}>${o?SI[s-1]:'🔒'}<small>${SN[s-1]}<br>${'⭐'.repeat(st)||'&nbsp;'}</small></button>`}h+='</div></div>'}
R(h+`<button class=btn onclick="vp()">📚 Kho Ôn Tập (${S.vault.length})</button><button class="btn ghost" onclick="if(confirm('Xoá nhân vật và tiến trình?')){localStorage.removeItem('hs');S=null;sl(0)}">Đổi nhân vật</button>`)}
function lv(r,s){const k=l=>QB[r+'-'+s+'-'+l];R(hud()+`<div class="card c"><div class=big>${s==4?'👹':'🦉'}</div><p class=tx>${s==4?`${BOSS[r-1]}: “Ngươi không giải cứu được dân làng đâu!”`:`Cụ Cú Mèo: “Hãy chọn mức độ phù hợp với em ở ${SN[s-1]}!”`}</p><p class=sm>${['Không giới hạn thời gian. Có lời giải ngay sau mỗi câu.','Không giới hạn thời gian. Câu sai vào Kho Ôn Tập.','⏱ 60 giây, sai bị trừ 3 giây. Cần đúng ít nhất một nửa số câu.','Đúng 1 câu: Boss mất 1 máu. Sai: em mất 1 Tim.'][s-1]}</p>${Object.keys(LV).map(l=>`<button class=btn onclick="play(${r},${s},'${l}')">${LV[l]} (${k(l)?k(l).length+' câu':'chưa có'})</button>`).join('')}<button class="btn ghost" onclick="map()">◀ Bản đồ</button></div>`)}
/* ===== CHƠI ===== */
function play(r,s,l){const src=QB[r+'-'+s+'-'+l];if(!src)return alert('Chặng này chưa có câu hỏi. Thầy/cô thêm vào questions.js với khoá "'+r+'-'+s+'-'+l+'"');if(S.hearts<=0){S.hearts=2}
G={r,s,l,q:sh(src.slice()),i:0,ok:0,w:[],tg:{},n:src.length,t0:Date.now(),hint:S.role=='Pháp sư'?2:0,sd:S.role=='Thợ rèn',time:60,boss:src.length};
if(s==3)G.tm=setInterval(()=>{if(G.paused)return;G.time--;if($('tm'))$('tm').textContent=G.time;if(G.time<=0)end()},1000);ask()}
function vp(){if(!S.vault.length)return alert('Kho Ôn Tập đang trống – em chưa sai câu nào!');G={v:1,r:1,s:1,l:'d',q:sh(S.vault.slice()),i:0,ok:0,w:[],tg:{},n:S.vault.length,hint:0};ask()}
const val=s=>{s=(''+s).replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-');if(s.includes('/')){const[a,b]=s.split('/');return a/b}return +s};
function ask(){const q=G.rev||G.q[G.i];G.cur=q;G.done=0;G.paused=0;G.rm=-1;if(q.t=='mc'&&S.role=='Thám hiểm'&&q.o.length>2&&!G.v)do G.rm=Math.floor(Math.random()*q.o.length);while(G.rm==q.a);
const top=G.v?'📚 Kho Ôn Tập':`${RI[G.r-1]} ${SN[G.s-1]} • ${LV[G.l]}`,pg=G.v?`Còn ${G.q.length-G.i} câu`:G.s==4?`${BOSS[G.r-1]} ${'❤️'.repeat(Math.max(0,G.boss))}${'🖤'.repeat(Math.max(0,G.n-G.boss))}`:G.s==3?`⏱ <b id=tm>${G.time}</b> giây`:`Câu ${G.i+1}/${G.n}`;
R(`<div class=bar id=hd>${hudIn()}</div><div class=card><div class=sm>${top}</div><div class=hp>${pg}</div>${G.rev?'<div class=hp>🧚 Tiên Hồi Sinh: giải lại câu vừa sai để hồi 2 Tim!</div>':''}<h3 style="font-family:inherit;line-height:1.5">${q.q}</h3>${BODY[q.t](q)}${S.role=='Pháp sư'&&!G.v?`<button class="btn ghost" id=hb onclick="hint()">💡 Gợi ý (${G.hint})</button><div id=hn class=sm></div>`:''}<div id=fb></div></div>`)}
function hint(){if(G.hint<=0||G.done)return;G.hint--;$('hb').textContent='💡 Gợi ý ('+G.hint+')';$('hn').textContent=G.cur.h||'Đọc kĩ đề, đổi về cùng dạng (phân số/thập phân) rồi làm từng bước, chú ý dấu.'}
const BODY={
mc:q=>q.o.map((t,i)=>`<button class="opt ${i==G.rm?'rm':''}" id=o${i} ${i==G.rm?'disabled':''} onclick="ck(${i})">${t}</button>`).join(''),
fill:q=>`<input id=fi placeholder="Nhập đáp số..." onkeydown="event.key=='Enter'&&cf()"><button class=btn onclick="cf()">Kiểm tra</button>`,
match:q=>{G.m={l:null,p:{}};return `<div class=sm>Chạm một ô bên trái, rồi chạm ô tương ứng bên phải</div><div class=g2><div>${q.L.map((t,i)=>`<button class=opt id=l${i} onclick="ml(${i})">${t}</button>`).join('')}</div><div>${q.R.map((t,i)=>`<button class=opt id=r${i} onclick="mr(${i})">${t}</button>`).join('')}</div></div>`},
order:q=>{G.o=[];return `<div class=hp id=ol>&nbsp;</div>`+sh(q.o.map((_,i)=>i)).map(i=>`<button class=opt id=p${i} onclick="po(${i})">${q.o[i]}</button>`).join('')+`<button class="btn ghost" onclick="ur()">↺ Chọn lại</button>`},
tfm:q=>{G.t=[];return q.s.map((t,i)=>`<div class=st>${t}<div class=g2><button class=opt id=t${i}1 onclick="pt(${i},1)">Đúng</button><button class=opt id=t${i}0 onclick="pt(${i},0)">Sai</button></div></div>`).join('')+`<button class=btn onclick="ct()">Kiểm tra</button>`},
nl:q=>{G.sel=null;const n=(q.hi-q.lo)*q.den,u=460/n;let h=`<div class=sm>Chạm vào vạch em chọn rồi bấm Xác nhận</div><svg viewBox="0 0 520 100" style="width:100%"><line x1="15" y1="50" x2="505" y2="50" stroke="#fff" stroke-width="3"/>`;for(let i=0;i<=n;i++){const k=q.lo*q.den+i,x=30+i*u,b=k%q.den==0;h+=`<line x1="${x}" y1="${b?36:42}" x2="${x}" y2="${b?64:58}" stroke="#fff" stroke-width="2"/>${b?`<text x="${x}" y="90" fill="#fff" font-size="16" text-anchor="middle">${k/q.den}</text>`:''}<circle id="c${k}" cx="${x}" cy="50" r="${Math.max(6,Math.min(14,u/2.2))}" fill="transparent" onclick="pk(${k})" style="cursor:pointer"/>`}return h+`</svg><button class=btn onclick="cn()">Xác nhận</button>`}};
const ck=i=>res(i===G.cur.a,i);
function cf(){const v=$('fi').value;if(!v.trim())return;res(G.cur.a.some(a=>Math.abs(val(a)-val(v))<1e-9||a.trim()==v.trim()))}
const COL=['#ffd166','#06d6a0','#4cc9f0','#f78fb3'];
function pnt(){const m=G.m,q=G.cur;q.L.forEach((_,i)=>{$('l'+i).style.background=m.l==i?'rgba(255,255,255,.45)':'';$('l'+i).style.borderColor=''});q.R.forEach((_,j)=>{$('r'+j).style.background=''});Object.keys(m.p).forEach((i,k)=>{$('l'+i).style.background=$('r'+m.p[i]).style.background=COL[k%4]+'88'})}
function ml(i){if(G.done||G.m.p[i]!==undefined)return;G.m.l=i;pnt()}
function mr(j){const m=G.m,q=G.cur;if(G.done||m.l===null||Object.values(m.p).includes(j))return;m.p[m.l]=j;m.l=null;pnt();if(Object.keys(m.p).length==q.L.length)res(q.a.every((a,i)=>m.p[i]===a))}
function po(i){if(G.done||G.o.includes(i))return;G.o.push(i);$('p'+i).disabled=true;$('ol').textContent=G.o.map(j=>G.cur.o[j]).join(' → ');if(G.o.length==G.cur.o.length)res(G.o.every((v,k)=>v==k))}
function ur(){if(G.done)return;G.o=[];G.cur.o.forEach((_,i)=>$('p'+i).disabled=false);$('ol').innerHTML='&nbsp;'}
function pt(i,v){if(G.done)return;G.t[i]=v;$('t'+i+v).classList.add('sel');$('t'+i+(1-v)).classList.remove('sel')}
function ct(){const q=G.cur;if(q.s.some((_,i)=>G.t[i]===undefined))return alert('Em chọn Đúng/Sai cho cả '+q.s.length+' ý nhé!');res(q.a.every((a,i)=>G.t[i]==(a?1:0)))}
function pk(k){if(G.done)return;if(G.sel!==null)$('c'+G.sel).setAttribute('fill','transparent');G.sel=k;$('c'+k).setAttribute('fill','#ffd86b')}
function cn(){if(G.sel===null)return alert('Em hãy chạm vào một vạch trên trục số!');res(G.sel===G.cur.a)}
const ansTxt=q=>q.t=='mc'?`Đáp án: <b>${q.o[q.a]}</b>`:q.t=='fill'?`Đáp án: <b>${q.a[0]}</b>`:q.t=='order'?`Đúng thứ tự: <b>${q.o.join(' → ')}</b>`:q.t=='match'?q.L.map((l,i)=>l+' ↔ '+q.R[q.a[i]]).join(' • '):q.t=='nl'?`Đáp án: vạch <b>${q.a}/${q.den}</b>`:q.s.map((_,i)=>`(${i+1}) ${q.a[i]?'Đúng':'Sai'}`).join(' | ');
function res(ok,p){if(G.done)return;G.done=1;G.paused=1;const q=G.cur;let note='';
if(G.rev){if(ok){S.hearts=2;G.rev=null;sfx.ok()}else sfx.no()}
else{const g=q.g||TAG[G.r-1];G.tg[g]=G.tg[g]||[0,0];G.tg[g][0]++;
if(ok){G.ok++;sfx.ok();if(G.v)S.vault=S.vault.filter(x=>x.q!=q.q);else{S.xp+=10*XPL[G.l];S.gold+=5;if(G.s==4)G.boss--}}
else{sfx.no();G.w.push(q);G.tg[g][1]++;if(!G.v){if(!S.vault.some(x=>x.q==q.q))S.vault.push(q);if(G.s==4)G.q.push(q);if(G.sd){G.sd=0;note='🛡️ Khiên rèn đã đỡ đòn!'}else if(G.s==3)G.time-=3;else{S.hearts--;if(S.hearts<=0)G.rev=q}}}}
save();$('hd').innerHTML=hudIn();if(q.t=='mc'){$('o'+q.a).classList.add('cor');if(!ok)$('o'+p).classList.add('bad')}
$('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'🎉 Chính xác!':'💥 Chưa đúng!'}</b> ${note}<br>${ansTxt(q)}<br>${q.e||''}<button class=btn onclick="nx()">Tiếp ▶</button></div>`}
function nx(){if(G.rev)return ask();G.i++;(G.v?G.i>=G.q.length:G.s==4?G.boss<=0:G.s==3?G.i>=G.n||G.time<=0:G.i>=G.q.length)?end():ask()}
function end(){if(G.ended)return;G.ended=1;clearInterval(G.tm);const{r,s,l}=G;const pass=G.v||(s==3?G.ok>=Math.ceil(G.n/2):s==4?G.boss<=0:1),tot=s==4?G.ok+G.w.length:G.n,acc=G.ok/(tot||1),st=pass?(acc>=1?3:acc>=.75?2:1):0,sec=Math.round((Date.now()-G.t0)/1000);
if(!G.v){const k=r+'-'+s,old=S.prog[k]||0;if(pass){S.xp+=Math.max(0,st-old)*20;S.prog[k]=Math.max(old,st);S.hearts=Math.min(S.max,S.hearts+1)}save();snd({r,s,l,ok:G.ok,n:tot,st,sec,pass,tg:G.tg})}
pass?(st==3?sfx.win():sfx.star()):sfx.no();if(st>=2)boom();
const last=!G.v&&r==5&&s==4&&pass;
R(hud()+`<div class="card c"><div class=big>${G.v?'📚':pass?'🏆':'💪'}</div><h2>${G.v?'Xong Kho Ôn Tập!':pass?'Vượt chặng thành công!':'Chưa đạt – cố lên Hiệp sĩ!'}</h2><div class=big style="font-size:40px">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p class=tx>Đúng ${G.ok}/${tot} câu • ${sec} giây</p>${G.w.length?`<h3>Các câu cần chú ý (đã vào Kho Ôn Tập)</h3>`+G.w.map(q=>`<div class=wr><b>${q.q}</b><br>${ansTxt(q)}<br>${q.e||''}</div>`).join(''):'<p class=sm>Không sai câu nào – tuyệt vời! 🎉</p>'}${last?`<button class=btn onclick="fin()">🏆 Nhận phần thưởng</button>`:pass&&!G.v?`<button class=btn onclick="${s<4?`lv(${r},${s+1})`:`lv(${r+1},1)`}">Chặng tiếp theo ▶</button><button class="btn ghost" onclick="lv(${r},${s})">Chơi lại ở mức khác</button>`:!G.v?`<button class=btn onclick="lv(${r},${s})">Thử lại</button>`:''}<button class="btn ghost" onclick="map()">🗺️ Về bản đồ</button></div>`)}
function snd(d){if(!API)return;const b=Object.assign({name:S.name,cls:S.cls,role:S.role,xp:S.xp,hearts:S.hearts,stars:stars()},d);fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).catch(()=>{})}
function fin(){const t=stars(),b=t>=50?'Đại Hiệp sĩ Hữu Tỉ 👑':t>=30?'Hiệp sĩ Tinh anh 🥇':'Hiệp sĩ Tập sự 🥉';sfx.win();boom();
R(`<div class="card c"><div class=big>🦉</div><p class=tx>“Chúc mừng Hiệp sĩ ${S.name} – ${S.cls}! Phong ấn của Quỷ Sai Dấu và Phù thủy Mẫu Số đã hoàn toàn bị phá vỡ. Vương quốc Hữu Tỉ đã tìm lại được sự cân bằng trên trục số nhờ trí tuệ và lòng kiên trì của em!”</p><h2>${b}</h2><p class=tx>✨ ${S.xp} XP • ⭐ ${t}/60 sao • ❤️ ${S.hearts} Tim</p><button class=btn id=sb onclick="snd({r:0,s:0,l:'d',ok:0,n:0,st:0,sec:0,pass:1,tg:{}});this.textContent='✅ Đã gửi cho Thầy/Cô';this.disabled=true">📨 Gửi kết quả cho Thầy/Cô</button><button class="btn ghost" onclick="vp()">📚 Luyện tập Kho Ôn Tập (${S.vault.length})</button><button class="btn ghost" onclick="map()">🗺️ Về bản đồ</button></div>`)}
intro();
</script></body></html>
